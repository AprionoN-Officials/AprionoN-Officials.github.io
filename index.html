<script>
const state = {
  data: null,
  root: null,
  view: "home",
  currentPath: null,
  current: null,
  items: [],
  visibleItems: [],
  searchQuery: "",
  sortBy: "newest",
  history: [],
  gallery: [],
  gi: 0,
  previousFocus: null,
  _inertSnapshot: null,
  _galleryLoadSeq: 0,
  _activeGalleryLoader: null,
  _activeGalleryTimer: null,
  _activeGalleryTarget: null,
  _loadedGallerySrc: "",
  modalHd: false,
  folderMap: null,
  gallerySource: "visible",
  _isNavigatingHistory: false,
  _pendingBack: 0,
  _backEpoch: 0,
  _backQueue: [],
  _deferred: [],
  _bootState: null
};
const INDEX_URL = "./index.json";

function esc(v) {
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function raw(path) {
  return state.data.repository.rawBase + path.split("/").map(encodeURIComponent).join("/");
}

const IMAGE_TIERS = {
  logo: { width: 256, q: 72 },
  card: { width: 420, q: 72 },
  modal: { width: 800, q: 78 },
  hd: { width: 1600, q: 85 }
};

function thumb(path, width = IMAGE_TIERS.card.width, q = IMAGE_TIERS.card.q) {
  return "https://wsrv.nl/?url=" + encodeURIComponent(raw(path)) + "&w=" + width + "&q=" + q + "&output=webp";
}

function walk(node, fn) {
  (node.children || []).forEach(c => {
    fn(c);
    if (c.type === "folder") walk(c, fn);
  });
}

function buildTree(paths) {
  const root = { name: "Render 2.0", type: "folder", path: "Render 2.0", children: [] };
  const maps = new Map([["Render 2.0", root]]);

  paths.forEach(path => {
    const parts = path.split("/");
    let parent = root;
    let acc = "Render 2.0";

    parts.slice(1, -1).forEach(name => {
      acc += "/" + name;
      if (!maps.has(acc)) {
        const n = { name: name, type: "folder", path: acc, children: [] };
        parent.children.push(n);
        maps.set(acc, n);
      }
      parent = maps.get(acc);
    });

    parent.children.push({ name: parts.at(-1), type: "image", path, ...(state.data?.metadata?.[path] || {}) });
  });

  const sort = n => {
    n.children?.sort((a, b) =>
      a.type !== b.type
        ? (a.type === "folder" ? -1 : 1)
        : a.name.localeCompare(b.name, "id", { numeric: true, sensitivity: "base" })
    );
    let totalImages = 0;
    let firstCover = "";
    let latestUpdate = "";
    n.children?.forEach(c => {
      sort(c);
      if (c.type === "image") {
        totalImages += 1;
        if (!firstCover) firstCover = c.path;
      } else if (c.type === "folder") {
        totalImages += c.imageCount || 0;
        if (!firstCover && c.coverPath) firstCover = c.coverPath;
      }
      const u = c.updatedAt || "";
      if (u > latestUpdate) latestUpdate = u;
    });
    if (n.type === "folder") {
      n.imageCount = totalImages;
      n.coverPath = firstCover;
      n.updatedAt = latestUpdate;
    }
  };
  sort(root);
  state.folderMap = maps;
  return root;
}

function count(node) {
  if (typeof node?.imageCount === "number") return node.imageCount;
  let n = 0;
  walk(node, c => { if (c.type === "image") n++; });
  return n;
}

function coverPath(node) {
  if (typeof node?.coverPath === "string") return node.coverPath;
  let p = null;
  walk(node, c => { if (!p && c.type === "image") p = c.path; });
  return p || "";
}

function isTopLevelFolder(folder) {
  if (!folder) return false;
  if (folder.type && folder.type !== "folder") return false;
  if (folder.path) {
    const parts = folder.path.split("/");
    return parts.length === 2 && parts[0] === "Render 2.0";
  }
  return state.root?.children?.some(c => c === folder) || false;
}

function badge(item) {
  let status = "";
  if (item && typeof item === "object") {
    if (item.status) {
      status = item.status;
    } else if (isTopLevelFolder(item)) {
      const target = normalizeName(item.name);
      const match = state.data?.recentFolders?.find(f =>
        f.name === item.name || (target && normalizeName(f.name) === target)
      );
      status = match?.status || "";
    }
  } else if (typeof item === "string") {
    const target = normalizeName(item);
    const match = state.data?.recentFolders?.find(f =>
      f.name === item || (target && normalizeName(f.name) === target)
    );
    status = match?.status || "";
  }
  return status === "new"
    ? '<span class="badge new">NEW</span>'
    : status === "update"
    ? '<span class="badge update">Update</span>'
    : "";
}

function find(path, node = state.root) {
  if (!node) return null;
  if (state.folderMap && node === state.root) {
    const found = state.folderMap.get(path);
    if (found) return found;
  }
  if (node.path === path) return node;
  for (const c of node.children || []) {
    const x = find(path, c);
    if (x) return x;
  }
  return null;
}

function findFolderByNameOrPath(target) {
  const rawTarget = String(target || "").trim();
  const decodedTarget = (() => {
    try { return decodeURIComponent(rawTarget); }
    catch { return rawTarget; }
  })();

  // Exact canonical candidates
  const candidates = [...new Set(
    [rawTarget, decodedTarget]
      .filter(Boolean)
      .flatMap(v => /^Render 2\.0(\/|$)/i.test(v) ? [v.replace(/^Render 2\.0/i, "Render 2.0")] : [v, "Render 2.0/" + v])
      .map(v => v.replace(/\/+$/, ""))
  )];

  for (const x of candidates) {
    const result = state.folderMap ? state.folderMap.get(x) : find(x);
    if (result?.type === "folder") return result;
  }

  const cleanTarget = normalizeName((candidates[0] || decodedTarget).replace(/^Render 2\.0\/?/i, ""));
  const fullTarget = normalizeName(/^Render 2\.0(\/|$)/i.test(rawTarget) ? rawTarget : "Render 2.0/" + rawTarget);
  if (!cleanTarget) return null;

  // 1. Prioritize top-level series folders (prevents character subfolder from shadowing top-level series)
  if (state.root?.children) {
    for (const c of state.root.children) {
      if (c.type === "folder" && normalizeName(c.name) === cleanTarget) return c;
    }
  }

  // 2. Support nested paths and deeper folders via normalized relative path, full path, or bare name
  if (state.folderMap) {
    for (const folder of state.folderMap.values()) {
      const relPath = folder.path.replace(/^Render 2\.0\/?/, "");
      if (normalizeName(folder.path) === fullTarget || (relPath && normalizeName(relPath) === cleanTarget)) {
        return folder;
      }
    }
    for (const folder of state.folderMap.values()) {
      if (normalizeName(folder.name) === cleanTarget) return folder;
    }
  } else if (state.root) {
    let matched = null;
    walk(state.root, node => {
      if (!matched && node.type === "folder") {
        const relPath = node.path.replace(/^Render 2\.0\/?/, "");
        if (normalizeName(node.path) === fullTarget || (relPath && normalizeName(relPath) === cleanTarget) || normalizeName(node.name) === cleanTarget) {
          matched = node;
        }
      }
    });
    if (matched) return matched;
  }
  return null;
}

// ----------------------------------------------------
// LOGIKA KOVER OTOMATIS (SINKRONISASI NAMA FOLDER & FILE KOVER)
// ----------------------------------------------------
function normalizeName(name) {
  return String(name || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}

function getCover(folder) {
  if (!folder) return "";
  const explicit = state.data?.covers || {};
  const folderName = folder.name || "";
  const folderPath = folder.path || "";
  const relPath = folderPath ? folderPath.replace(/^Render 2\.0\/?/i, "") : "";
  const target = normalizeName(folderName);

  // 1. Explicit cover mapped by full canonical path or relative series/character path
  if (folderPath && explicit[folderPath]) return explicit[folderPath];
  if (relPath && explicit[relPath]) return explicit[relPath];

  // 2. Top-level series folders check series covers
  if (isTopLevelFolder(folder)) {
    if (explicit[folderName]) return explicit[folderName];

    if (target) {
      const match = Object.entries(explicit).find(([key]) => normalizeName(key) === target);
      if (match) return match[1];

      const lenientMatch = Object.entries(explicit).find(([key]) => {
        const keyNorm = normalizeName(key);
        return keyNorm && (keyNorm.includes(target) || target.includes(keyNorm));
      });
      if (lenientMatch) return lenientMatch[1];
    }
  } else {
    // 3. Nested character folders: support explicit covers for unique character names
    // Never allow a nested character folder to inherit its parent series cover
    const parentSeriesName = folderPath ? folderPath.split("/")[1] || "" : "";
    const parentNorm = normalizeName(parentSeriesName);
    const isParentSeries = (parentNorm && target && parentNorm === target) ||
      (parentSeriesName && parentSeriesName === folderName);
    const isKnownTopSeries = state.root?.children?.some(c =>
      c.name === folderName || (target && normalizeName(c.name) === target)
    );

    if (explicit[folderName] && !isParentSeries && !isKnownTopSeries) {
      return explicit[folderName];
    }
  }

  // 4. Auto-fallback: folder's own coverPath (first image render)
  return coverPath(folder);
}

function handleCardImageError(e) {
  const img = e?.target;
  if (!img || img.tagName !== "IMG") return;
  const coverBox = img.closest?.(".folder-cover");
  if (coverBox) {
    coverBox.innerHTML = '<i class="fas fa-folder" style="font-size:2rem;color:#0284c7"></i>';
    return;
  }
  const imgBox = img.closest?.(".img-box");
  if (imgBox) {
    imgBox.innerHTML = '<i class="fas fa-image" style="font-size:2rem;color:#0284c7"></i>';
  }
}

function onCoverError(img) {
  handleCardImageError({ target: img });
}

function handleCardClick(e) {
  const card = e?.target?.closest?.('article[data-action]');
  if (!card) return;
  const action = card.dataset?.action;
  if (action === "open-folder" && card.dataset.path) {
    openFolderByPath(card.dataset.path);
  } else if (action === "open-recent") {
    const idx = Number(card.dataset.index);
    if (Number.isInteger(idx)) openRecent(idx);
  } else if (action === "open-image" && card.dataset.path) {
    openCurrent(card.dataset.path);
  }
}

function renderFolderCard({ name, path, cover, imageCount, badgeHtml }) {
  return `
    <article role="button" tabindex="0" class="folder-card" data-action="open-folder" data-path="${esc(path)}">
      <div class="folder-cover">
        ${cover ? `<img src="${thumb(cover, 420, 72)}" loading="lazy" decoding="async" alt="${esc(name)}">` : '<i class="fas fa-folder" style="font-size:2rem;color:#0284c7"></i>'}
      </div>
      <div class="folder-body">
        <div class="folder-row">
          <span class="folder-name">${esc(name)}</span>${badgeHtml || ""}
        </div>
        <span class="folder-count"><i class="far fa-images"></i> ${imageCount} Render</span>
      </div>
    </article>
  `;
}

function renderImageCard({ name, path, subtitleHtml, action, index }) {
  const dataAttr = action === "open-recent"
    ? `data-action="open-recent" data-index="${Number(index)}"`
    : `data-action="open-image" data-path="${esc(path)}"`;
  return `
    <article role="button" tabindex="0" class="card" ${dataAttr}>
      <div class="img-box">
        <img src="${thumb(path, 420, 72)}" loading="lazy" decoding="async" alt="${esc(name)}">
      </div>
      <div class="card-info">
        <h3>${esc(name)}</h3>
        <p>${subtitleHtml}</p>
      </div>
    </article>
  `;
}

// ----------------------------------------------------
// RENDER BERANDA
// ----------------------------------------------------
function renderRecent() {
  const rs = state.data.recentRenders;
  document.getElementById("recent-images").innerHTML = rs.map((x, i) => renderImageCard({
    name: x.name,
    path: x.path,
    subtitleHtml: `<i class="fas fa-gamepad"></i> ${esc(x.game)}`,
    action: "open-recent",
    index: i
  })).join("");

  const fs = state.data.recentFolders.slice(0, 5);
  document.getElementById("recent-folders").innerHTML = fs.map(x => {
    const f = findFolderByNameOrPath(x.name);
    if (!f) return "";
    return renderFolderCard({
      name: f.name,
      path: f.path,
      cover: getCover(f),
      imageCount: count(f),
      badgeHtml: badge(f)
    });
  }).join("");
}

function childItems(folder) {
  const isRoot = folder === state.root || folder?.path === "Render 2.0";
  return (folder.children || []).map(x => {
    if (x.type !== "folder") return x;
    let rootStatus = "";
    let rootUpdated = "";
    if (isRoot) {
      const target = normalizeName(x.name);
      const match = state.data?.recentFolders?.find(f =>
        f.name === x.name || (target && normalizeName(f.name) === target)
      );
      rootStatus = match?.status || "";
      rootUpdated = match?.updatedAt || "";
    }
    return {
      ...x,
      cover: getCover(x),
      imageCount: count(x),
      status: x.status || rootStatus,
      updatedAt: x.updatedAt || rootUpdated
    };
  });
}

function renderItems(items, title) {
  state.visibleItems = items;
  state.current = title;
  document.getElementById("folder-title").innerHTML = `<span class="bar">|</span><i class="far fa-folder-open"></i> ${esc(title)}`;
  const box = document.getElementById("folder-content");

  if (!items.length) {
    box.innerHTML = '<div class="empty">Folder ini kosong.</div>';
    return;
  }

  let out = "";
  // Render Folder
  items.filter(x => x.type === "folder").forEach(f => {
    out += renderFolderCard({
      name: f.name,
      path: f.path,
      cover: f.cover,
      imageCount: f.imageCount ?? count(f),
      badgeHtml: badge(f)
    });
  });

  // Render Gambar
  items.filter(x => x.type === "image").forEach(img => {
    out += renderImageCard({
      name: img.name,
      path: img.path,
      subtitleHtml: '<i class="far fa-image"></i> Image',
      action: "open-image"
    });
  });

  box.innerHTML = out;
}

// ----------------------------------------------------
// NAVIGASI FOLDER & HISTORY STATE MACHINE (PHASE 3.2)
//
// Model: every history entry created by this app carries a namespaced,
// versioned snapshot { app, v, idx, view, path, title, search, sort, scrollY,
// stack, modal }. `idx` is the entry's own position among app-created entries,
// so it survives reload and traversal (it is a property of the entry, not a
// separate counter). popstate always reconciles the UI to the entry the
// browser landed on, so no "ignore next popstate" flag is needed: in-app Back
// simply asks the browser to traverse and lets popstate drive the UI.
// ----------------------------------------------------
const HISTORY_APP = "render2";
const HISTORY_VERSION = 1;
const SORT_MODES = ["newest", "oldest", "az", "za"];

function isModalOpen() {
  return Boolean(document.getElementById("modal")?.classList?.contains("show"));
}

function currentEntryIdx() {
  const s = window.history?.state;
  return s && s.app === HISTORY_APP && s.v === HISTORY_VERSION && Number.isInteger(s.idx) && s.idx >= 0 ? s.idx : 0;
}

function describeModal() {
  if (!isModalOpen() || !state.gallery.length) return null;
  const cur = state.gallery[state.gi];
  return { source: state.gallerySource === "recent" ? "recent" : "visible", gi: state.gi, path: cur?.path || "" };
}

function buildHistoryPayload(idx) {
  return {
    app: HISTORY_APP,
    v: HISTORY_VERSION,
    idx,
    view: state.view,
    path: state.currentPath,
    title: state.current,
    search: state.searchQuery || "",
    sort: state.sortBy || "newest",
    scrollY: typeof window.scrollY === "number" ? window.scrollY : 0,
    stack: state.history.map(h => ({
      path: h.path,
      title: h.title,
      search: h.searchQuery || "",
      sort: h.sortBy || "newest",
      scrollY: h.scrollY || 0
    })),
    modal: describeModal()
  };
}

function syncBrowserHistory(mode = "push") {
  const h = window.history;
  if (typeof h?.pushState !== "function" || state._isNavigatingHistory) return false;
  const isReplace = mode === "replace" && typeof h.replaceState === "function";
  const payload = buildHistoryPayload(isReplace ? currentEntryIdx() : currentEntryIdx() + 1);
  try {
    if (isReplace) h.replaceState(payload, "", window.location.href);
    else h.pushState(payload, "", window.location.href);
    return true;
  } catch (err) {
    // Restrictive environments (sandboxed frames, replaceState rate limits)
    return false;
  }
}

const BACK_TIMEOUT_MS = 1500;

// In-app Back asks the browser to traverse and lets popstate update the UI.
// `idx - pending` is where the app will be once already-queued traversals
// land, so rapid repeated requests can never walk past the app's first entry.
function canTraverseBack() {
  return typeof window.history?.back === "function" && currentEntryIdx() - state._pendingBack > 0;
}

function consumePendingBack() {
  if (state._backQueue.length > 0) {
    const ticket = state._backQueue.shift();
    if (ticket.timer !== null && typeof window.clearTimeout === "function") {
      window.clearTimeout(ticket.timer);
    }
    state._backQueue.forEach(t => { t.sawPopState = true; });
    state._pendingBack = state._backQueue.length;
  } else {
    state._pendingBack = Math.max(0, state._pendingBack - 1);
  }
}

function requestBack(onTimeout) {
  if (!canTraverseBack()) return false;
  const ticket = {
    timer: null,
    sawPopState: false,
    onTimeout: typeof onTimeout === "function" ? onTimeout : null
  };
  state._backQueue.push(ticket);
  state._pendingBack = state._backQueue.length;
  state._backEpoch += 1;
  try {
    window.history.back();
  } catch (err) {
    const idx = state._backQueue.indexOf(ticket);
    if (idx !== -1) state._backQueue.splice(idx, 1);
    state._pendingBack = state._backQueue.length;
    return false;
  }
  // A traversal that never produces popstate must clean up only its own ticket,
  // never interfere with newer in-flight traversals, and unblock deferred navigation.
  if (typeof window.setTimeout === "function") {
    ticket.timer = window.setTimeout(() => {
      const idx = state._backQueue.indexOf(ticket);
      if (idx === -1) return;
      state._backQueue.splice(idx, 1);
      state._pendingBack = state._backQueue.length;
      if (state._pendingBack === 0 && !ticket.sawPopState && ticket.onTimeout) {
        try { ticket.onTimeout(); } catch (err) {}
      }
      flushDeferred();
    }, BACK_TIMEOUT_MS);
  }
  return true;
}

// A history mutation (push) issued while a traversal is still in flight would be
// applied against an entry the browser is about to leave, and the late popstate
// would then undo it. Serialize: run it once the queued traversals have landed.
function deferUntilSettled(fn) {
  if (state._pendingBack <= 0) return false;
  state._deferred.push(fn);
  return true;
}

function flushDeferred() {
  if (state._pendingBack > 0 || !state._deferred.length) return;
  const queued = state._deferred.splice(0);
  queued.forEach(fn => { try { fn(); } catch (err) {} });
}

/**
 * Preserve the raw active search query when drilling from an active folder view
 * into a folder whose own name does not match, provided a descendant matches.
 */
function resolveCarriedSearch(folder) {
  if (state.view !== "folder" || !state.currentPath || !folder) return "";
  const rawQuery = state.searchQuery || "";
  const q = rawQuery.trim().toLowerCase();
  if (!q || folder.name.toLowerCase().includes(q)) return "";
  const hasDescendantMatch = (folder.children || []).some(child => matchesSearch(child, q));
  return hasDescendantMatch ? rawQuery : "";
}

function openFolderByPath(path, options = {}) {
  if (!options.fromHistory && deferUntilSettled(() => openFolderByPath(path, options))) return;
  const f = findFolderByNameOrPath(path);
  if (!f) return;

  const targetPath = f.path;
  const targetTitle = f.name;

  // Duplicate navigation guard: avoid pushing duplicate frame if already in this folder
  if (state.view === "folder" && state.currentPath === targetPath) return;

  const nextSearch = !options.fromHistory ? resolveCarriedSearch(f) : "";

  // Snapshot active folder view if navigating deeper from a valid folder view
  if (!options.fromHistory && state.view === "folder" && state.currentPath) {
    // Persist current search/sort/scroll into the entry we are leaving
    syncBrowserHistory("replace");
    state.history.push({
      view: "folder",
      path: state.currentPath,
      title: state.current,
      items: [...state.items],
      searchQuery: state.searchQuery || "",
      sortBy: state.sortBy || "newest",
      scrollY: typeof window.scrollY === "number" ? window.scrollY : 0
    });
  } else if (!options.fromHistory && state.view === "home") {
    // Clean transition from Home: do not push phantom Home frame
    state.history = [];
  }

  state.view = "folder";
  state.currentPath = targetPath;
  state.current = targetTitle;
  state.searchQuery = nextSearch;
  state.sortBy = "newest";

  document.getElementById("home-view").classList.add("hidden");
  document.getElementById("folder-view").classList.add("active");
  document.getElementById("browser-search").value = nextSearch;
  document.getElementById("browser-sort").value = "newest";

  state.items = childItems(f);
  applyControlsForFolder(targetTitle);

  if (!options.preserveScroll) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  if (!options.fromHistory) {
    syncBrowserHistory("push");
  }
}

function browseAllFolders(options = {}) {
  if (!options.fromHistory && deferUntilSettled(() => browseAllFolders(options))) return;
  if (!state.root) return;
  // Duplicate navigation guard: already browsing the root folder
  if (!options.fromHistory && state.view === "folder" && state.currentPath === "Render 2.0") return;
  if (!options.fromHistory) {
    state.history = [];
  }

  state.view = "folder";
  state.currentPath = "Render 2.0";
  state.current = "Render 2.0";
  state.searchQuery = "";
  state.sortBy = "newest";

  document.getElementById("home-view").classList.add("hidden");
  document.getElementById("folder-view").classList.add("active");
  document.getElementById("browser-search").value = "";
  document.getElementById("browser-sort").value = "newest";

  state.items = childItems(state.root);
  applyControlsForFolder("Render 2.0");

  if (!options.preserveScroll) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  if (!options.fromHistory) {
    syncBrowserHistory("push");
  }
}

function restoreScrollPosition(scrollY) {
  const top = Number.isFinite(scrollY) ? scrollY : 0;
  window.scrollTo({ top, behavior: "auto" });
}

function restorePreviousFolderLocally(options = {}) {
  const prev = state.history.pop();
  if (!prev) {
    showHome({ fromHistory: true });
    if (!options.fromHistory) syncBrowserHistory("replace");
    return;
  }
  state.view = prev.view || "folder";
  state.currentPath = prev.path;
  state.current = prev.title;
  state.items = prev.items && prev.items.length ? prev.items : (findFolderByNameOrPath(prev.path) ? childItems(findFolderByNameOrPath(prev.path)) : []);
  state.searchQuery = prev.searchQuery || "";
  state.sortBy = prev.sortBy || "newest";

  document.getElementById("home-view").classList.add("hidden");
  document.getElementById("folder-view").classList.add("active");
  document.getElementById("browser-search").value = state.searchQuery;
  document.getElementById("browser-sort").value = state.sortBy;

  applyControlsForFolder(prev.title);

  if (typeof prev.scrollY === "number") {
    restoreScrollPosition(prev.scrollY);
  }

  if (!options.fromHistory) {
    syncBrowserHistory("replace");
  }
}

function goBack(options = {}) {
  if (!state.history.length) {
    // Nothing above the current folder: return to whatever sits below it
    // (Home), aligned with browser history via viaInAppBack
    showHome({ ...options, viaInAppBack: true });
    return;
  }

  // Preferred path: traverse browser history; popstate restores the frame.
  // If history.back() never emits popstate, fall back locally on timeout.
  if (!options.fromHistory && requestBack(() => restorePreviousFolderLocally())) return;
  // Traversals already queued cover this request; never fall back mid-flight
  if (!options.fromHistory && state._pendingBack > 0) return;

  // Fallback (history API unavailable or no earlier app entry): restore locally
  restorePreviousFolderLocally(options);
}

function showHome(options = {}) {
  if (!options.fromHistory && !options.viaInAppBack && deferUntilSettled(() => showHome(options))) return;
  const wasHome = state.view === "home" && !state.currentPath;
  const hadModalEntry = Boolean(window.history?.state?.modal);

  // In-app Back to Home: traverse browser history and let popstate render it.
  // If traversals are already in flight, a redundant request is ignored.
  if (!options.fromHistory && options.viaInAppBack) {
    if (requestBack(() => {
      showHome({ fromHistory: true });
      syncBrowserHistory("replace");
    })) return;
    if (state._pendingBack > 0) return;
  }

  if (isModalOpen()) closeModalUI();

  document.getElementById("folder-view").classList.remove("active");
  document.getElementById("home-view").classList.remove("hidden");

  state.view = "home";
  state.currentPath = null;
  state.current = null;
  state.items = [];
  state.visibleItems = [];
  state.searchQuery = "";
  state.sortBy = "newest";
  state.history = [];

  document.getElementById("browser-search").value = "";
  document.getElementById("browser-sort").value = "newest";

  if (typeof options.restoreScrollY === "number") {
    restoreScrollPosition(options.restoreScrollY);
  } else if (!options.preserveScroll) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  if (!options.fromHistory) {
    // Already on Home, or leaving a modal entry: overwrite instead of stacking
    syncBrowserHistory(wasHome || hadModalEntry ? "replace" : "push");
  }
}

function sortItems(arr, m) {
  const x = [...arr];
  if (m === "az") return x.sort((a, b) => a.name.localeCompare(b.name, "id", { numeric: true, sensitivity: "base" }));
  if (m === "za") return x.sort((a, b) => b.name.localeCompare(a.name, "id", { numeric: true, sensitivity: "base" }));
  const isOldest = m === "oldest";
  return x.sort((a, b) => {
    const dateA = String(a.updatedAt || "");
    const dateB = String(b.updatedAt || "");
    if (dateA && dateB) {
      const diff = isOldest ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);
      if (diff !== 0) return diff;
    } else if (dateA && !dateB) {
      return -1;
    } else if (!dateA && dateB) {
      return 1;
    }
    return a.name.localeCompare(b.name, "id", { numeric: true, sensitivity: "base" });
  });
}

function applyControlsForFolder(title) {
  state.current = title;
  applyControls();
}

function matchesSearch(item, q) {
  return item.name.toLowerCase().includes(q) ||
    (item.children || []).some(child => matchesSearch(child, q));
}

function applyControls(options = {}) {
  const searchInput = document.getElementById("browser-search");
  const sortInput = document.getElementById("browser-sort");
  const q = searchInput ? searchInput.value.trim().toLowerCase() : (state.searchQuery || "").trim().toLowerCase();
  const m = sortInput ? sortInput.value : (state.sortBy || "newest");

  state.searchQuery = searchInput ? searchInput.value : "";
  state.sortBy = m;

  const x = state.items.filter(
    i => !q || matchesSearch(i, q)
  );
  renderItems(sortItems(x, m), state.current);

  // Finding 3: Live search and sort synchronization via replaceState
  // Only sync to history on actual user input, not during initial folder render before pushState
  if (options.syncHistory && !state._isNavigatingHistory && state.view === "folder" && state.currentPath) {
    syncBrowserHistory("replace");
  }
}

// Strict validation: only entries written by this app (namespace + version)
// are trusted; everything else is treated as foreign and rejected.
function normalizeHistoryState(s) {
  if (!s || typeof s !== "object" || s.app !== HISTORY_APP || s.v !== HISTORY_VERSION) return null;
  const view = s.view === "folder" ? "folder" : s.view === "home" ? "home" : null;
  if (!view) return null;
  if (view === "folder" && (typeof s.path !== "string" || !s.path)) return null;
  const str = (v, d = "") => (typeof v === "string" ? v : d);
  const sort = v => (SORT_MODES.includes(v) ? v : "newest");
  const num = v => (Number.isFinite(v) ? v : 0);
  const stack = Array.isArray(s.stack)
    ? s.stack
        .filter(e => e && typeof e === "object" && typeof e.path === "string" && e.path)
        .map(e => ({ path: e.path, title: str(e.title), search: str(e.search), sort: sort(e.sort), scrollY: num(e.scrollY) }))
    : [];
  const modal = s.modal && typeof s.modal === "object"
    ? { source: s.modal.source === "recent" ? "recent" : "visible", gi: Number.isInteger(s.modal.gi) ? s.modal.gi : 0, path: str(s.modal.path) }
    : null;
  return {
    view,
    path: view === "folder" ? s.path : null,
    title: str(s.title),
    search: str(s.search),
    sort: sort(s.sort),
    scrollY: num(s.scrollY),
    stack,
    modal
  };
}

// Reconcile the view DOM to a validated history entry without touching scroll or history.
function renderHistoryView(n, folder) {
  if (n.view === "home" || !folder) {
    if (isModalOpen() && !(n.view === "home" && n.modal)) closeModalUI();
    if (state.view !== "home") showHome({ fromHistory: true, preserveScroll: true });
    return;
  }

  state.history = n.stack.map(entry => {
    const node = findFolderByNameOrPath(entry.path);
    return {
      view: "folder",
      path: entry.path,
      title: entry.title,
      items: node ? childItems(node) : [],
      searchQuery: entry.search,
      sortBy: entry.sort,
      scrollY: entry.scrollY
    };
  });

  const sameView = state.view === "folder" && state.currentPath === folder.path &&
    state.searchQuery === n.search && state.sortBy === n.sort;
  if (!sameView) {
    state.view = "folder";
    state.currentPath = folder.path;
    state.current = n.title || folder.name;
    state.searchQuery = n.search;
    state.sortBy = n.sort;

    document.getElementById("home-view").classList.add("hidden");
    document.getElementById("folder-view").classList.add("active");
    document.getElementById("browser-search").value = n.search;
    document.getElementById("browser-sort").value = n.sort;

    state.items = childItems(folder);
    applyControlsForFolder(state.current);
  }
}

// Reconcile the UI to a validated history entry. Never touches history itself.
function applyHistoryState(n) {
  state._isNavigatingHistory = true;
  try {
    let folder = null;
    if (n.view === "folder") {
      folder = findFolderByNameOrPath(n.path);
      if (folder && folder.type !== "folder") folder = null;
    }

    // 1. Reconcile view DOM (only re-renders folder grid when view/folder/search/sort changed)
    renderHistoryView(n, folder);

    // 2. Reconcile modal state
    if (n.modal && (n.view === "home" || folder)) restoreModal(n.modal);
    else if (isModalOpen()) closeModalUI();

    // 3. Restore scroll position unconditionally (independent of sameView)
    restoreScrollPosition(n.scrollY);
  } finally {
    state._isNavigatingHistory = false;
  }
}

function handlePopState(e) {
  // One popstate consumed one queued in-app traversal (if any)
  consumePendingBack();

  const n = normalizeHistoryState(e?.state);
  if (!n) {
    // Foreign or malformed entry: show Home and stamp the entry as ours
    state._isNavigatingHistory = true;
    try {
      closeModalUI();
      if (state.view !== "home") showHome({ fromHistory: true });
    } finally {
      state._isNavigatingHistory = false;
    }
    syncBrowserHistory("replace");
    flushDeferred();
    return;
  }
  applyHistoryState(n);
  flushDeferred();
}

// ----------------------------------------------------
// NAVIGASI MODAL / GALERI (MASALAH #2 TERCUKUPI)
// ----------------------------------------------------
function buildGallery(source) {
  const list = source === "recent"
    ? (state.data?.recentRenders || [])
    : state.visibleItems.filter(x => x.type === "image");
  return list.map(x => ({
    name: x.name,
    path: x.path,
    thumb: thumb(x.path, IMAGE_TIERS.card.width, IMAGE_TIERS.card.q),
    image: thumb(x.path, IMAGE_TIERS.modal.width, IMAGE_TIERS.modal.q),
    hdImage: thumb(x.path, IMAGE_TIERS.hd.width, IMAGE_TIERS.hd.q)
  }));
}

function openRecent(i) {
  showGallery(buildGallery("recent"), i, "recent");
}

function openCurrent(path) {
  // Ambil semua gambar yang ada di folder/tampilan aktif saat ini
  const imgs = buildGallery("visible");
  const i = imgs.findIndex(x => x.path === path);
  if (i >= 0) showGallery(imgs, i, "visible");
}

function isElementFocusable(el) {
  if (!el || typeof el.focus !== "function") return false;
  if (el.isConnected === false) return false;
  if (typeof document.contains === "function" && !document.contains(el)) return false;
  if (el.disabled || el.getAttribute?.("aria-disabled") === "true" || el.hasAttribute?.("disabled")) return false;
  if (el.hidden || el.closest?.("[hidden]")) return false;
  for (let cur = el; cur; cur = cur.parentElement) {
    if (cur.inert) return false;
  }
  if (el.closest?.("[inert]")) return false;
  if (typeof window.getComputedStyle === "function") {
    const cs = window.getComputedStyle(el);
    if (cs && (cs.display === "none" || cs.visibility === "hidden")) return false;
  }
  if (typeof el.getClientRects === "function" && el.getClientRects().length === 0) return false;
  return true;
}

function getModalFocusableElements(modal) {
  if (!modal || typeof modal.querySelectorAll !== "function") return [];
  const selector = 'a[href], button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])';
  return [...modal.querySelectorAll(selector)].filter(
    el => el.getAttribute?.("tabindex") !== "-1" && isElementFocusable(el)
  );
}

function setBackgroundInert(modal) {
  if (state._inertSnapshot || !document.body?.children) return;
  const snapshot = [];
  for (const el of document.body.children) {
    if (!el || el === modal || el.tagName === "SCRIPT") continue;
    if (typeof el.contains === "function" && modal && el.contains(modal)) continue;
    snapshot.push({ el, inert: Boolean(el.inert) });
    el.inert = true;
  }
  state._inertSnapshot = snapshot;
}

function restoreBackgroundInert() {
  if (!state._inertSnapshot) return;
  for (const { el, inert } of state._inertSnapshot) {
    el.inert = inert;
  }
  state._inertSnapshot = null;
}

function tryFocus(el) {
  if (!isElementFocusable(el)) return false;
  el.focus();
  return document.activeElement === el;
}

function getModalFocusFallbacks() {
  const folderView = document.getElementById("folder-view");
  if (folderView?.classList?.contains("active")) {
    return [
      document.querySelector("#folder-view .back-btn"),
      folderView
    ];
  }
  return [
    document.querySelector("#home-view .browse-btn"),
    document.getElementById("home-view")
  ];
}

function restoreModalFocus() {
  const prev = state.previousFocus;
  state.previousFocus = null;
  if (tryFocus(prev)) return true;
  for (const fallback of getModalFocusFallbacks()) {
    if (tryFocus(fallback)) return true;
  }
  return false;
}

const GALLERY_SLOW_LOAD_MS = 6000;
const GALLERY_MAX_RETRIES = 1;

function clearGalleryTimer() {
  if (state._activeGalleryTimer !== null && typeof window.clearTimeout === "function") {
    window.clearTimeout(state._activeGalleryTimer);
  }
  state._activeGalleryTimer = null;
}

function cancelGalleryLoad() {
  state._galleryLoadSeq += 1;
  clearGalleryTimer();
  if (state._activeGalleryLoader) {
    state._activeGalleryLoader.onload = null;
    state._activeGalleryLoader.onerror = null;
    try { state._activeGalleryLoader.src = ""; } catch (err) {}
    state._activeGalleryLoader = null;
  }
  state._activeGalleryTarget = null;
}

function isCurrentGalleryLoad(seq, targetSrc) {
  return seq === state._galleryLoadSeq && isModalOpen() && state._activeGalleryTarget === targetSrc;
}

function findCachedThumbSrc(thumbUrl) {
  if (!thumbUrl || typeof document.querySelectorAll !== "function") return "";
  const imgs = document.querySelectorAll("#home-view img, #folder-view img");
  for (const img of imgs) {
    if (!img || !img.complete || !(img.naturalWidth > 0)) continue;
    if (img.currentSrc === thumbUrl || img.src === thumbUrl || img.getAttribute?.("src") === thumbUrl) {
      return img.currentSrc || img.src || thumbUrl;
    }
  }
  return "";
}

function syncHdToggleButton() {
  const btn = document.getElementById("hd-toggle");
  if (!btn) return;
  const active = Boolean(state.modalHd);
  btn.setAttribute?.("aria-pressed", active ? "true" : "false");
  btn.textContent = active ? "Mode Standar (800px)" : "Muat HD (1600px)";
}

function toggleModalHD() {
  if (!isModalOpen() || !state.gallery.length) return;
  state.modalHd = !state.modalHd;
  updateGallery();
}

function showGallery(g, i, source = "visible", options = {}) {
  if (!Array.isArray(g) || !g.length) return;
  if (!options.fromHistory && !isModalOpen() && deferUntilSettled(() => showGallery(g, i, source, options))) return;
  const isAlreadyOpen = isModalOpen();
  state.gallery = g;
  state.gallerySource = source;
  state.gi = Number.isInteger(i) ? i : 0;
  state.gi = ((state.gi % g.length) + g.length) % g.length;
  state.modalHd = false;
  if (!isAlreadyOpen) state.previousFocus = document.activeElement;
  const modal = document.getElementById("modal");
  modal.classList.add("show");
  setBackgroundInert(modal);
  document.body.style.overflow = "hidden";
  document.querySelector(".close").focus();
  updateGallery();

  // A freshly opened modal gets its own history entry (not when restoring one)
  if (!isAlreadyOpen && !options.fromHistory) {
    syncBrowserHistory("push");
  }
}

// Rebuild the gallery described by a history entry (Back/Forward/reload)
function restoreModal(m) {
  const g = buildGallery(m.source);
  if (!g.length) {
    if (isModalOpen()) closeModalUI();
    return;
  }
  const byPath = m.path ? g.findIndex(x => x.path === m.path) : -1;
  showGallery(g, byPath >= 0 ? byPath : m.gi, m.source, { fromHistory: true });
}

function startGalleryLoadAttempt(seq, targetSrc, image, status, retryCount) {
  const onLoad = () => {
    if (!isCurrentGalleryLoad(seq, targetSrc)) return;
    clearGalleryTimer();
    state._activeGalleryLoader = null;
    state._loadedGallerySrc = targetSrc;
    if (image.src !== targetSrc) image.src = targetSrc;
    status.textContent = "";
  };
  const onError = () => {
    if (!isCurrentGalleryLoad(seq, targetSrc)) return;
    if (retryCount < GALLERY_MAX_RETRIES) {
      if (state._activeGalleryLoader) {
        state._activeGalleryLoader.onload = null;
        state._activeGalleryLoader.onerror = null;
        state._activeGalleryLoader = null;
      }
      startGalleryLoadAttempt(seq, targetSrc, image, status, retryCount + 1);
      return;
    }
    clearGalleryTimer();
    state._activeGalleryLoader = null;
    state._loadedGallerySrc = "";
    image.src = "";
    status.textContent = "Preview gagal dimuat. Gunakan tautan PNG original.";
  };

  if (typeof Image === "function") {
    const loader = new Image();
    state._activeGalleryLoader = loader;
    loader.onload = onLoad;
    loader.onerror = onError;
    loader.src = targetSrc;
  } else {
    image.onload = onLoad;
    image.onerror = onError;
    image.src = targetSrc;
  }
}

function updateGallery() {
  const x = state.gallery[state.gi];
  if (!x) return;
  const image = document.getElementById("fullImage");
  const status = document.getElementById("preview-status");
  const download = document.getElementById("download-original");
  download.href = raw(x.path);
  const bytes = state.data.metadata?.[x.path]?.size;
  download.textContent = "Download PNG Original" + (bytes ? ` (${(bytes / 1000000).toFixed(1)} MB)` : "");
  document.getElementById("caption").textContent = `${x.name} • ${state.gi + 1} / ${state.gallery.length}`;

  const isSingle = state.gallery.length <= 1;
  document.getElementById("prev").disabled = isSingle;
  document.getElementById("next").disabled = isSingle;
  syncHdToggleButton();

  const targetSrc = state.modalHd ? (x.hdImage || x.image) : x.image;
  if (state._activeGalleryTarget === targetSrc && (state._activeGalleryLoader || state._loadedGallerySrc === targetSrc)) {
    if (state._loadedGallerySrc === targetSrc) status.textContent = "";
    return;
  }

  const prevLoadedSrc = state._loadedGallerySrc;
  cancelGalleryLoad();
  const seq = state._galleryLoadSeq;
  state._activeGalleryTarget = targetSrc;
  state._loadedGallerySrc = "";
  status.textContent = state.modalHd ? "Memuat preview HD (1600px)…" : "Memuat preview…";
  image.onload = null;
  image.onerror = null;
  image.alt = x.name;

  if (state.modalHd && prevLoadedSrc === x.image) {
    // Keep standard 800px preview visible while upgrading to 1600px HD
  } else {
    const placeholder = findCachedThumbSrc(x.thumb);
    image.src = placeholder || "";
  }

  if (typeof window.setTimeout === "function") {
    state._activeGalleryTimer = window.setTimeout(() => {
      if (!isCurrentGalleryLoad(seq, targetSrc)) return;
      status.textContent = "Preview masih dimuat (koneksi lambat)…";
    }, GALLERY_SLOW_LOAD_MS);
  }

  startGalleryLoadAttempt(seq, targetSrc, image, status, 0);
}

function nextImage() {
  if (!state.gallery || state.gallery.length <= 1) return;
  state.gi = (state.gi + 1) % state.gallery.length;
  state.modalHd = false;
  updateGallery();
  syncModalEntry();
}

function previousImage() {
  if (!state.gallery || state.gallery.length <= 1) return;
  state.gi = (state.gi - 1 + state.gallery.length) % state.gallery.length;
  state.modalHd = false;
  updateGallery();
  syncModalEntry();
}

// Keep the modal's history entry pointing at the image being viewed
function syncModalEntry() {
  if (isModalOpen() && window.history?.state?.modal) syncBrowserHistory("replace");
}

// Pure UI close: never touches browser history
function closeModalUI() {
  const modal = document.getElementById("modal");
  if (!modal?.classList?.contains("show")) return false;
  cancelGalleryLoad();
  state._loadedGallerySrc = "";
  state.modalHd = false;
  syncHdToggleButton();
  const image = document.getElementById("fullImage");
  image.onload = null;
  image.onerror = null;
  image.src = "";
  document.getElementById("preview-status").textContent = "";
  modal.classList.remove("show");
  document.body.style.overflow = "";
  restoreBackgroundInert();
  restoreModalFocus();
  return true;
}

// User-initiated close (Escape, close button, backdrop): close the UI, then
// pop the modal's history entry so Back/Forward stay symmetrical.
function closeModal(e) {
  if (e && e.target && e.target.id !== "modal" && !e.target.classList?.contains("close")) return;
  if (!closeModalUI()) return;
  if (window.history?.state?.modal) {
    if (!requestBack(() => {
      if (!isModalOpen() && window.history?.state?.modal) syncBrowserHistory("replace");
    })) {
      syncBrowserHistory("replace");
    }
  }
}

// Event Listeners
if (typeof window.addEventListener === "function") {
  window.addEventListener("popstate", handlePopState);
  // Keep the current entry's scroll position fresh so Back/Forward restore
  // where the user actually was (debounced: replaceState is rate limited)
  let scrollSyncTimer = null;
  window.addEventListener("scroll", () => {
    if (typeof window.setTimeout !== "function") return;
    window.clearTimeout(scrollSyncTimer);
    scrollSyncTimer = window.setTimeout(() => {
      if (!state._isNavigatingHistory) syncBrowserHistory("replace");
    }, 250);
  }, { passive: true });
}
document.getElementById("home-view")?.addEventListener?.("click", handleCardClick);
document.getElementById("folder-view")?.addEventListener?.("click", handleCardClick);
document.addEventListener("error", handleCardImageError, true);
document.addEventListener("keydown", e => {
  const card = e.target.closest?.('article[role="button"]');
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); card.click(); }
});
document.getElementById("browser-search").addEventListener("input", () => applyControls({ syncHistory: true }));
document.getElementById("browser-sort").addEventListener("change", () => applyControls({ syncHistory: true }));

document.addEventListener("keydown", e => {
  if (!isModalOpen()) return;
  if (e.key === "Tab") {
    const modal = document.getElementById("modal");
    const controls = getModalFocusableElements(modal);
    if (!controls.length) {
      e.preventDefault();
      modal.focus();
      return;
    }
    const first = controls[0], last = controls[controls.length - 1];
    const active = document.activeElement;
    const insideModal = Boolean(active && typeof modal.contains === "function" && modal.contains(active));
    if (!insideModal || active === modal) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
      return;
    }
    if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") previousImage();
});

// Initial history entry: stamp Home with replaceState (no extra entry). If the
// page was reloaded onto one of our entries, remember it and restore after data loads.
(function initHistory() {
  const h = window.history;
  if (typeof h?.replaceState !== "function") return;
  try { if ("scrollRestoration" in h) h.scrollRestoration = "manual"; } catch (err) {}
  const n = normalizeHistoryState(h.state);
  if (n) state._bootState = n;
  else syncBrowserHistory("replace");
})();

// Fetch Data
fetch(INDEX_URL, { cache: "no-cache" })
  .then(r => {
    if (!r.ok) throw Error("index.json gagal dimuat (" + r.status + ")");
    return r.json();
  })
  .then(data => {
    state.data = data;
    state.root = buildTree(data.files || []);
    renderRecent();
    if (state._bootState) {
      const boot = state._bootState;
      state._bootState = null;
      applyHistoryState(boot);
    }
  })
  .catch(err => {
    document.getElementById("recent-images").innerHTML = `<div class="empty"><strong>Gagal memuat katalog.</strong><br>${esc(err.message)}</div>`;
    document.getElementById("recent-folders").innerHTML = '<div class="empty">Pastikan index.json berada di folder yang sama dengan index.html.</div>';
  });
</script></body></html>
