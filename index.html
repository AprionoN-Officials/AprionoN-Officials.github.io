<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Render 2.0 By Apriono.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--blue:#0284c7;--dark:#075985;--text:#0f172a;--muted:#64748b;--glass:rgba(255,255,255,.56)}*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}body{min-height:100vh;color:var(--text);background:linear-gradient(135deg,#e1f4fe,#c4e9fd);background-attachment:fixed}.top-banner{background:linear-gradient(90deg,#0284c7,#0369a1);color:#fff;text-align:center;padding:9px 15px;font-size:.88rem;font-weight:700}.top-banner i{color:#fde047;margin:0 5px}header{width:90%;max-width:1000px;margin:22px auto 0;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.logo{color:#0369a1;font-weight:700;font-size:1.1rem;text-decoration:none}.nav-buttons{display:flex;gap:10px;align-items:center}.nav-btn{color:#0c4a6e;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 14px;border-radius:12px;border:0;background:transparent;cursor:pointer}.nav-btn:hover{background:rgba(255,255,255,.65);color:var(--blue)}.dropdown{position:relative}.dropdown:after{content:"";position:absolute;top:100%;left:0;width:100%;height:14px}.dropdown-content{visibility:hidden;opacity:0;pointer-events:none;position:absolute;top:calc(100% + 10px);left:0;min-width:190px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.8);border-radius:12px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.1);z-index:20;transition:.16s}.dropdown:hover .dropdown-content,.dropdown:focus-within .dropdown-content{visibility:visible;opacity:1;pointer-events:auto}.dropdown-content a{display:flex;gap:10px;padding:12px 15px;color:#0c4a6e;text-decoration:none;font-size:.85rem}.dropdown-content a:hover{background:rgba(2,132,199,.08);color:var(--blue)}main{width:90%;max-width:1100px;margin:0 auto;padding:42px 0 70px}.hero-text{text-align:center;margin-bottom:38px}.hero-text h1{color:var(--dark);font-size:clamp(1.9rem,4vw,2.35rem)}.section-title{display:flex;align-items:center;gap:8px;color:#0369a1;font-size:1.3rem;margin:32px 0 18px}.section-title .bar{color:var(--blue);font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.04);cursor:pointer;transition:.25s}.card:hover{transform:translateY(-6px);box-shadow:0 12px 25px rgba(0,0,0,.08)}.img-box{height:230px;display:flex;align-items:center;justify-content:center;padding:10px}.img-box img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}.card-info{padding:14px;text-align:center}.card-info h3{font-size:.95rem;color:#0369a1;margin-bottom:5px}.card-info p{font-size:.75rem;color:var(--muted);font-weight:600}.folder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.folder-card{background:var(--glass);border:1px solid rgba(255,255,255,.82);border-radius:12px;overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 4px 10px rgba(0,0,0,.02)}.folder-card:hover{background:rgba(255,255,255,.84);transform:translateY(-3px)}.folder-cover{height:145px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16)}.folder-cover img{width:100%;height:100%;object-fit:contain}.folder-body{padding:12px 14px}.folder-row{display:flex;gap:8px;align-items:center}.folder-name{flex:1;min-width:0;color:#0369a1;font-size:.88rem;font-weight:700}.folder-count{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;font-weight:600}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:.66rem;font-weight:800;line-height:1;text-transform:uppercase}.badge.new{color:#b45309;background:#fef3c7}.badge.update{color:#047857;background:#d1fae5}.browse-wrap{text-align:center;margin:18px 0}.browse-btn,.back-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid rgba(255,255,255,.82);border-radius:11px;background:rgba(255,255,255,.62);color:#0369a1;font-weight:700;cursor:pointer}.browse-btn:hover,.back-btn:hover{background:rgba(255,255,255,.88)}#folder-view{display:none}#folder-view.active{display:block}#home-view.hidden{display:none}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:8px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.search{width:min(330px,100%);display:flex;gap:8px;align-items:center;padding:9px 12px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.82);border-radius:10px}.search i{color:var(--blue)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:.82rem;font-weight:600}.sort{display:flex;gap:7px;align-items:center;color:#0c4a6e;font-size:.8rem;font-weight:700}.sort select{padding:9px 11px;border:1px solid rgba(255,255,255,.85);border-radius:10px;background:rgba(255,255,255,.72);color:#0c4a6e;font-weight:700}.empty{grid-column:1/-1;padding:30px;border-radius:16px;text-align:center;background:rgba(255,255,255,.5);color:var(--muted)}footer{text-align:center;padding:10px 5% 30px}footer p{font-size:.9rem;font-weight:600}.social{margin-top:14px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.social a{color:#0369a1;text-decoration:none;font-size:.9rem;font-weight:700}.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.86);align-items:center;justify-content:center;flex-direction:column;padding:30px}.modal.show{display:flex}.modal img{max-width:92%;max-height:78vh;object-fit:contain;border-radius:12px}.close{position:absolute;right:30px;top:15px;color:#fff;font-size:40px;cursor:pointer}.nav-img{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}.nav-img:disabled{opacity:.25}.prev{left:20px}.next{right:20px}.caption{color:#fff;margin-top:14px;font-weight:600}@media(max-width:768px){header{flex-direction:column;gap:10px;padding:15px}.toolbar{align-items:stretch;flex-direction:column}.tools{justify-content:stretch;flex-direction:column;align-items:stretch}.search,.sort,.sort select{width:100%}.img-box{height:200px}.nav-img{width:42px;height:42px}.prev{left:10px}.next{right:10px}}
</style></head><body>
<div class="top-banner"><i class="fas fa-star"></i> Render 2.0 By Apriono. <i class="fas fa-star"></i></div><header><a class="logo" href="#" onclick="showHome();return false;">Render 2.0 By Apriono.</a><div class="nav-buttons"><a class="nav-btn" href="#" onclick="showHome();return false;">Beranda</a><a class="nav-btn" href="https://www.deviantart.com/apriononurhakim" target="_blank" rel="noopener">Render</a><div class="dropdown"><button class="nav-btn">Download <i class="fas fa-caret-down"></i></button><div class="dropdown-content"><a href="https://drive.google.com/drive/folders/17-8gXFzkiU0lEEDD1NJTURTjbz58oiP1?usp=drive_link" target="_blank" rel="noopener"><i class="fab fa-google-drive"></i> Via Google Drive</a><a href="http://u.pc.cd/XsnctalK" target="_blank" rel="noopener"><i class="fas fa-cloud"></i> Via pCloud</a></div></div><a class="nav-btn" href="https://ko-fi.com/apriononurhakim" target="_blank" rel="noopener">Support</a></div></header>
<main><div class="hero-text"><h1>Selamat Datang Di Render 2.0</h1></div><section id="home-view"><h2 class="section-title"><span class="bar">|</span><i class="far fa-image"></i> Render Terbaru</h2><div id="recent-images" class="grid"></div><h2 class="section-title"><span class="bar">|</span><i class="far fa-folder-open"></i> 5 Folder Terbaru</h2><div id="recent-folders" class="folder-grid"></div><div class="browse-wrap"><button class="browse-btn" onclick="browseAllFolders()"><i class="fas fa-folder-tree"></i> Browse Semua Folder <i class="fas fa-arrow-right"></i></button></div></section><section id="folder-view"><div class="toolbar"><button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Kembali</button><div class="tools"><div class="search"><i class="fas fa-search"></i><input id="browser-search" type="search" placeholder="Cari folder atau render..."></div><label class="sort"><span>Urutkan</span><select id="browser-sort"><option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="az">Nama A–Z</option><option value="za">Nama Z–A</option></select></label></div></div><h2 id="folder-title" class="section-title"></h2><div id="folder-content" class="grid"></div></section></main>
<div id="modal" class="modal" onclick="closeModal(event)"><span class="close" onclick="closeModal()">×</span><button id="prev" class="nav-img prev" onclick="event.stopPropagation();previousImage()"><i class="fas fa-chevron-left"></i></button><img id="fullImage" alt="Preview"><button id="next" class="nav-img next" onclick="event.stopPropagation();nextImage()"><i class="fas fa-chevron-right"></i></button><div id="caption" class="caption"></div></div><footer><p>© 2026 Apriono Nurhakim. All Rights Reserved.</p><div class="social"><a href="https://www.instagram.com/apriononurhakim_" target="_blank">Instagram</a><a href="https://www.facebook.com/ApriononurhakimOfficial" target="_blank">Facebook</a><a href="https://www.deviantart.com/apriononurhakim" target="_blank">DeviantArt</a><a href="https://www.youtube.com/apriononurhakim" target="_blank">YouTube</a></div></footer>
<script>
const state={data:null,root:null,current:null,items:[],history:[],gallery:[],gi:0};const INDEX_URL="./index.json";
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function raw(path){return state.data.repository.rawBase+path.split("/").map(encodeURIComponent).join("/")}function thumb(path,width=420,q=72){return "https://wsrv.nl/?url="+encodeURIComponent(raw(path))+"&w="+width+"&q="+q+"&output=webp"}function walk(node,fn){(node.children||[]).forEach(c=>{fn(c);if(c.type==="folder")walk(c,fn)})}
function buildTree(paths){const root={name:"Render 2.0",type:"folder",path:"Render 2.0",children:[]};const maps=new Map([["Render 2.0",root]]);paths.forEach(path=>{const parts=path.split("/");let parent=root,acc="Render 2.0";parts.slice(1,-1).forEach(name=>{acc+="/"+name;if(!maps.has(acc)){const n={name:name,type:"folder",path:acc,children:[]};parent.children.push(n);maps.set(acc,n)}parent=maps.get(acc)});parent.children.push({name:parts.at(-1),type:"image",path})});const sort=n=>{n.children?.sort((a,b)=>a.type!==b.type?a.type==="folder"?-1:1:a.name.localeCompare(b.name,"id",{numeric:true,sensitivity:"base"}));n.children?.forEach(sort)};sort(root);return root}
function count(node){let n=0;walk(node,c=>{if(c.type==="image")n++});return n}function coverPath(node){let p=null;walk(node,c=>{if(!p&&c.type==="image")p=c.path});return p||""}function badge(name){const x=state.data.recentFolders.find(f=>f.name===name);return x?.status==="new"?'<span class="badge new">NEW</span>':x?.status==="update"?'<span class="badge update">Update</span>':""}function find(path,node=state.root){if(node.path===path)return node;for(const c of node.children||[]){const x=find(path,c);if(x)return x}return null}
function getCover(folder){const explicit=state.data.covers||{};if(explicit[folder.name])return explicit[folder.name];const normalize=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"");const target=normalize(folder.name);const match=Object.entries(explicit).find(([k])=>normalize(k)===target);if(match)return match[1];const fallback=coverPath(folder);return fallback}
function renderRecent(){const rs=state.data.recentRenders;document.getElementById("recent-images").innerHTML=rs.map((x,i)=>`<article class="card" onclick="openRecent(${i})"><div class="img-box"><img src="${thumb(x.path,420,72)}" loading="lazy" decoding="async" alt="${esc(x.name)}"></div><div class="card-info"><h3>${esc(x.name)}</h3><p><i class="fas fa-gamepad"></i> ${esc(x.game)}</p></div></article>`).join("");const fs=state.data.recentFolders.slice(0,5);document.getElementById("recent-folders").innerHTML=fs.map(x=>{const f=find("Render 2.0/"+x.name);if(!f)return"";const cp=getCover(f);return `<article class="folder-card" onclick='openFolderByPath(${JSON.stringify(f.path)})'><div class="folder-cover">${cp?`<img src="${thumb(cp,420,72)}" loading="lazy" decoding="async" alt="${esc(f.name)}">`:'<i class="fas fa-folder" style="font-size:2rem;color:#0284c7"></i>'}</div><div class="folder-body"><div class="folder-row"><span class="folder-name">${esc(f.name)}</span>${badge(f.name)}</div><span class="folder-count"><i class="far fa-images"></i> ${count(f)} Render</span></div></article>`}).join("")}
function childItems(folder){return(folder.children||[]).map(x=>x.type==="folder"?{...x,cover:getCover(x),imageCount:count(x),status:(state.data.recentFolders.find(f=>f.name===x.name)?.status||""),updatedAt:(state.data.recentFolders.find(f=>f.name===x.name)?.updatedAt||"")}:x)}
function renderItems(items,title){state.items=items;state.current=title;document.getElementById("folder-title").innerHTML=`<span class="bar">|</span><i class="far fa-folder-open"></i> ${esc(title)}`;const box=document.getElementById("folder-content");if(!items.length){box.innerHTML='<div class="empty">Folder ini kosong.</div>';return}let out="";items.filter(x=>x.type==="folder").forEach(f=>{out+=`<article class="folder-card" onclick='openFolderByPath(${JSON.stringify(f.path)})'><div class="folder-cover">${f.cover?`<img src="${thumb(f.cover,420,72)}" loading="lazy" decoding="async" alt="${esc(f.name)}">`:'<i class="fas fa-folder" style="font-size:2rem;color:#0284c7"></i>'}</div><div class="folder-body"><div class="folder-row"><span class="folder-name">${esc(f.name)}</span>${badge(f.name)}</div><span class="folder-count"><i class="far fa-images"></i> ${f.imageCount??count(f)} Render</span></div></article>`});items.filter(x=>x.type==="image").forEach(img=>{out+=`<article class="card" onclick='openCurrent(${JSON.stringify(img.path)})'><div class="img-box"><img src="${thumb(img.path,420,72)}" loading="lazy" decoding="async" alt="${esc(img.name)}"></div><div class="card-info"><h3>${esc(img.name)}</h3><p><i class="far fa-image"></i> Image</p></div></article>`});box.innerHTML=out}
function openFolderByPath(path){const f=find(path);if(!f)return;state.history.push({items:[...state.items],title:state.current});document.getElementById("home-view").classList.add("hidden");document.getElementById("folder-view").classList.add("active");document.getElementById("browser-search").value="";document.getElementById("browser-sort").value="newest";renderItems(childItems(f),f.name)}function browseAllFolders(){state.history=[];document.getElementById("home-view").classList.add("hidden");document.getElementById("folder-view").classList.add("active");document.getElementById("browser-search").value="";document.getElementById("browser-sort").value="newest";renderItems(childItems(state.root),"Render 2.0")}function goBack(){if(!state.history.length){showHome();return}const p=state.history.pop();renderItems(p.items,p.title)}function showHome(){document.getElementById("folder-view").classList.remove("active");document.getElementById("home-view").classList.remove("hidden");state.history=[]}
function sortItems(arr,m){const x=[...arr];if(m==="az")return x.sort((a,b)=>a.name.localeCompare(b.name,"id",{numeric:true,sensitivity:"base"}));if(m==="za")return x.sort((a,b)=>b.name.localeCompare(a.name,"id",{numeric:true,sensitivity:"base"}));return x.sort((a,b)=>m==="oldest"?String(a.updatedAt||"").localeCompare(String(b.updatedAt||"")):String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))||a.name.localeCompare(b.name,"id",{numeric:true}))}
function applyControls(){const q=document.getElementById("browser-search").value.trim().toLowerCase(),m=document.getElementById("browser-sort").value;const x=state.items.filter(i=>!q||i.name.toLowerCase().includes(q)||(i.children||[]).some(c=>c.name.toLowerCase().includes(q)));renderItems(sortItems(x,m),state.current)}function openRecent(i){showGallery(state.data.recentRenders.map(x=>({name:x.name,image:raw(x.path)})),i)}function openCurrent(path){const imgs=state.items.filter(x=>x.type==="image").map(x=>({name:x.name,image:raw(x.path)}));const i=imgs.findIndex(x=>x.image===raw(path));if(i>=0)showGallery(imgs,i)}function showGallery(g,i){state.gallery=g;state.gi=i;updateGallery();document.getElementById("modal").classList.add("show");document.body.style.overflow="hidden"}function updateGallery(){const x=state.gallery[state.gi];if(!x)return;document.getElementById("fullImage").src=x.image;document.getElementById("caption").textContent=`${x.name} • ${state.gi+1} / ${state.gallery.length}`;document.getElementById("prev").disabled=state.gallery.length<2;document.getElementById("next").disabled=state.gallery.length<2}function nextImage(){if(!state.gallery.length)return;state.gi=(state.gi+1)%state.gallery.length;updateGallery()}function previousImage(){if(!state.gallery.length)return;state.gi=(state.gi-1+state.gallery.length)%state.gallery.length;updateGallery()}function closeModal(e){if(e&&e.target&&e.target.id!=="modal"&&!e.target.classList.contains("close"))return;document.getElementById("modal").classList.remove("show");document.getElementById("fullImage").src="";document.body.style.overflow=""}
document.getElementById("browser-search").addEventListener("input",applyControls);document.getElementById("browser-sort").addEventListener("change",applyControls);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="ArrowRight"&&document.getElementById("modal").classList.contains("show"))nextImage();if(e.key==="ArrowLeft"&&document.getElementById("modal").classList.contains("show"))previousImage()});
fetch(INDEX_URL,{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error("index.json gagal dimuat ("+r.status+")");return r.json()}).then(data=>{state.data=data;state.root=buildTree(data.files||[]);renderRecent()}).catch(err=>{document.getElementById("recent-images").innerHTML=`<div class="empty"><strong>Gagal memuat katalog.</strong><br>${esc(err.message)}</div>`;document.getElementById("recent-folders").innerHTML='<div class="empty">Pastikan index.json berada di folder yang sama dengan index.html.</div>'});
</script></body></html>
