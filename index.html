<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apriono Nurhakim | Creative Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #a5f3fc;
            --accent-blue: #22d3ee;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- HEADER GLASSMORPHISM --- */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0369a1;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            text-decoration: none;
            color: #0c4a6e;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: transparent;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            color: #0284c7;
        }

        /* --- DROPDOWN DOWNLOAD --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            min-width: 180px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .dropdown-content a {
            color: #0c4a6e;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background: rgba(2, 132, 199, 0.1);
            color: #0284c7;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* --- MAIN CONTENT --- */
        main {
            padding-top: 140px;
            padding-bottom: 100px;
            max-width: 1200px;
            margin: 0 auto;
            width: 90%;
        }

        .hero-text {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            color: #0c4a6e;
            margin-bottom: 10px;
        }

        /* --- GRID GALERI --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .content-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .content-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid var(--glass-border);
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .card-info h3 {
            font-size: 1rem;
            color: #075985;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* --- FOOTER --- */
        footer {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px 5%;
            text-align: center;
            border-top: 1px solid var(--glass-border);
        }

        .social-text {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .social-link {
            text-decoration: none;
            color: #0369a1;
            font-weight: 600;
            transition: color 0.3s;
        }

        .social-link:hover {
            color: #0ea5e9;
        }

        /* Responsif Mobile */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                top: 10px;
                padding: 15px;
            }
            .nav-buttons { gap: 5px; flex-wrap: wrap; justify-content: center; }
            .nav-btn { padding: 5px 10px; font-size: 0.8rem; }
            .dropdown-content { left: 50%; transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">APRIONO<span>.</span></a>
        <div class="nav-buttons">
            <a href="#" class="nav-btn">Beranda</a>
            <a href="#" class="nav-btn">Render</a>
            <div class="dropdown">
                <div class="nav-btn">Download <i class="fas fa-caret-down"></i></div>
                <div class="dropdown-content" id="folder-list-menu">
                    <a href="#">Memuat folder...</a>
                </div>
            </div>
            <a href="#" class="nav-btn">Support</a>
        </div>
    </header>

    <main>
        <div class="hero-text">
            <h1>Eksplorasi Konten Terbaru</h1>
            <p>Visual dari Google Drive yang diperbarui secara otomatis.</p>
        </div>

        <div class="gallery-grid" id="gallery">
            <p style="text-align: center; grid-column: 1/-1;">Menghubungkan ke Drive...</p>
        </div>
    </main>

    <footer>
        <p>© 2026 Apriono Nurhakim. All Rights Reserved.</p>
        <div class="social-text">
            <a href="#" class="social-link"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="#" class="social-link"><i class="fab fa-facebook"></i> Facebook</a>
            <a href="#" class="social-link"><i class="fab fa-deviantart"></i> DeviantArt</a>
            <a href="#" class="social-link"><i class="fab fa-github"></i> GitHub</a>
        </div>
    </footer>

    <script>
        // GANTI INI dengan URL dari "Deploy as Web App" Google Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby96nQZPbFRbK7SZLvjU4ymWhdfXSEopyvafcnF---tZWq0x-tPC7kwQejyf50bGxsP/exec";

        async function fetchData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                // 1. Render Menu Download (Urut Abjad)
                const menuContainer = document.getElementById('folder-list-menu');
                menuContainer.innerHTML = ''; 
                data.menu.forEach(folder => {
                    const a = document.createElement('a');
                    a.href = folder.link;
                    a.target = "_blank";
                    a.textContent = folder.name;
                    menuContainer.appendChild(a);
                });

                // 2. Render Galeri Gambar (Urut Terbaru)
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';
                
                if (data.gallery.length === 0) {
                    gallery.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Tidak ada gambar ditemukan.</p>';
                    return;
                }

                data.gallery.forEach(item => {
                    const card = `
                        <div class="content-card">
                            <img src="${item.img}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Error+Loading+Image'">
                            <div class="card-info">
                                <h3>${item.title}</h3>
                                <p><i class="far fa-calendar-alt"></i> ${new Date(item.date).toLocaleDateString('id-ID')}</p>
                            </div>
                        </div>
                    `;
                    gallery.innerHTML += card;
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('gallery').innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: red;">Gagal memuat data. Pastikan URL Script benar dan izin akses sudah dibuka.</p>';
            }
        }

        // Jalankan saat halaman dimuat
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
