<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apriono Nurhakim | Creative Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #a5f3fc; /* Biru Muda Terang */
            --accent-blue: #22d3ee;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Background dengan gradien biru muda yang lembut */
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- HEADER GLASSMORPHISM --- */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0369a1;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            text-decoration: none;
            color: #0c4a6e;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            color: #0284c7;
        }

        /* --- MAIN CONTENT --- */
        main {
            padding-top: 140px;
            padding-bottom: 100px;
            max-width: 1200px;
            margin: 0 auto;
            width: 90%;
        }

        .hero-text {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            color: #0c4a6e;
            margin-bottom: 10px;
        }

        /* --- GRID GALERI 10 GAMBAR --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .content-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .content-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .card-info h3 {
            font-size: 1rem;
            color: #075985;
        }

        /* --- FOOTER --- */
        footer {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px 5%;
            text-align: center;
            border-top: 1px solid var(--glass-border);
        }

        .social-text {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .social-link {
            text-decoration: none;
            color: #0369a1;
            font-weight: 600;
            transition: color 0.3s;
        }

        .social-link i {
            margin-right: 8px;
        }

        .social-link:hover {
            color: #0ea5e9;
        }

        /* Responsif Mobile */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                top: 10px;
            }
            .nav-buttons {
                gap: 5px;
            }
            .nav-btn {
                padding: 5px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">APRIONO<span>.</span></a>
        <div class="nav-buttons">
            <a href="#" class="nav-btn">Beranda</a>
            <a href="#" class="nav-btn">Render</a>
            <a href="#" class="nav-btn">Download</a>
            <a href="#" class="nav-btn">Support</a>
        </div>
    </header>

    <main>
        <div class="hero-text">
            <h1>Eksplorasi Konten Terbaru</h1>
            <p>Koleksi visual dan proyek sistem dari berbagai platform.</p>
        </div>

        <div class="gallery-grid" id="gallery">
            </div>
    </main>

    <footer>
        <p>© 2026 Apriono Nurhakim. All Rights Reserved.</p>
        <div class="social-text">
            <a href="#" class="social-link"><i class="fab fa-instagram"></i>Instagram</a>
            <a href="#" class="social-link"><i class="fab fa-facebook"></i>Facebook</a>
            <a href="#" class="social-link"><i class="fab fa-deviantart"></i>DeviantArt</a>
            <a href="#" class="social-link"><i class="fab fa-github"></i>GitHub</a>
        </div>
    </footer>

    <script>
        // Data Dummy untuk 10 Gambar (Anda bisa mengganti URL src dengan link pCloud/DeviantArt Anda)
        const projects = [
            { title: "Visual Render 01", img: "https://picsum.photos/id/10/400/300" },
            { title: "System Database", img: "https://picsum.photos/id/20/400/300" },
            { title: "Design Concept", img: "https://picsum.photos/id/30/400/300" },
            { title: "UI Prototype", img: "https://picsum.photos/id/40/400/300" },
            { title: "Network Security", img: "https://picsum.photos/id/50/400/300" },
            { title: "Graphic Art 02", img: "https://picsum.photos/id/60/400/300" },
            { title: "Web Interface", img: "https://picsum.photos/id/70/400/300" },
            { title: "Cloud Architecture", img: "https://picsum.photos/id/80/400/300" },
            { title: "Digital Illustration", img: "https://picsum.photos/id/90/400/300" },
            { title: "Server Monitoring", img: "https://picsum.photos/id/100/400/300" },
        ];

        const gallery = document.getElementById('gallery');

        // Loop untuk menampilkan 10 kartu
        projects.forEach(item => {
            const card = `
                <div class="content-card">
                    <img src="${item.img}" alt="${item.title}">
                    <div class="card-info">
                        <h3>${item.title}</h3>
                    </div>
                </div>
            `;
            gallery.innerHTML += card;
        });
    </script>
</body>
</html>
