name: Deploy to GitHub Pages

on:
  push:
    branches: ["root"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test catalog and browsing
        run: node --test tests/*.test.cjs

      - name: Generate catalog from tracked images
        run: node scripts/build-catalog.cjs

      - name: Stage lightweight website
        run: |
          mkdir -p _site
          cp index.html index.json _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
